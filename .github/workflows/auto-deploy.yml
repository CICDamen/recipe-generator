name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Trigger Coolify deploy
        run: |
          curl -X GET "http://localhost:8000/api/v1/deploy?uuid=${{ secrets.COOLIFY_DEPLOY_URL }}&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            --fail
